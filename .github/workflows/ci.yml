name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "15 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Quality gates (run in parallel)
  # ──────────────────────────────────────────────

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Setup dependencies
        run: make setup
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run tests
        run: make test-coverage
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Coverage summary
        if: always()
        run: |
          python - coverage.xml pytest-results.xml <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, sys, xml.etree.ElementTree as ET
          from pathlib import Path

          cov, junit = sys.argv[1], sys.argv[2:]
          o = ["## Coverage Report", ""]

          t = f = s = 0
          seen = False
          for pat in junit:
              for path in sorted(glob.glob(pat)):
                  try:
                      r = ET.parse(path).getroot()
                  except ET.ParseError:
                      continue
                  seen = True
                  for su in (r.iter("testsuite") if r.tag == "testsuites" else [r]):
                      t += int(su.get("tests") or 0)
                      f += int(su.get("failures") or 0) + int(su.get("errors") or 0)
                      s += int(su.get("skipped") or 0)
          if seen:
              o += ["### Test Results", "",
                    "| Status | Passed | Failed | Skipped | Total |",
                    "|---|---:|---:|---:|---:|",
                    f"| {'✅ Passed' if not f else '❌ Failed'} | {t - f - s} | {f} | {s} | {t} |", ""]

          p = Path(cov)
          if not p.exists():
              o += [f"> No coverage report at `{cov}`."]
          else:
              r = ET.parse(p).getroot()
              c, v = int(r.get("lines-covered") or 0), int(r.get("lines-valid") or 0)
              o += ["### Coverage Summary", "", "| Metric | Value |", "|---|---:|",
                    f"| Line coverage | **{(100.0 * c / v if v else 0):.1f}%** |",
                    f"| Lines covered | {c:,} / {v:,} |",
                    f"| Lines missing | {v - c:,} |", ""]
              rows = []
              for cl in r.iter("class"):
                  ls = list(cl.iter("line"))
                  if ls:
                      h = sum(1 for x in ls if int(x.get("hits") or 0) > 0)
                      rows.append((100.0 * h / len(ls),
                                   cl.get("filename") or cl.get("name") or "?", h, len(ls)))
              rows.sort()
              if rows:
                  o += ["<details>",
                        f"<summary>Per-file coverage ({len(rows)} files, least covered first)</summary>",
                        "", "| File | Coverage | Covered / Total |", "|---|---:|---:|"]
                  o += [f"| `{n}` | {q:.1f}% | {h} / {tt} |" for q, n, h, tt in rows]
                  o += ["", "</details>", ""]
          print("\n".join(o))
          PY

      # Consumed by the weekly coverage report, which reads the artifact from
      # the newest successful run on main. Name is per-matrix-version because
      # upload-artifact@v4 requires unique names within a run.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  e2e:
    if: github.event_name != 'schedule' && github.repository == 'runpod/runpod-python'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[test]" --quiet || uv pip install -e .
          uv pip install runpod-flash pytest pytest-asyncio pytest-timeout pytest-rerunfailures httpx
          uv pip install -e . --reinstall --no-deps
          python -c "import runpod; print(f'runpod: {runpod.__version__} from {runpod.__file__}')"

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          pytest tests/e2e/ -v -p no:xdist --timeout=600 --reruns 1 --reruns-delay 5 --log-cli-level=INFO -o "addopts="
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_SDK_GIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  codeql:
    if: github.event_name == 'schedule' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: python
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: "/language:python"

  # ──────────────────────────────────────────────
  # Validation gate
  # ──────────────────────────────────────────────

  validation:
    runs-on: ubuntu-latest
    needs: [test, e2e, codeql]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          results=("${{ needs.test.result }}" "${{ needs.e2e.result }}" "${{ needs.codeql.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more quality checks failed (got: $result)"
              exit 1
            fi
          done
